name: Sync LeetCode Statistics

on:
  schedule:
    - cron: '0 */6 * * *' # Automatically syncs every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/leetcode_stats.svg'
      - 'README.md'

jobs:
  update-leetcode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Sync LeetCode Statistics
        run: python scripts/update_leetcode.py

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode_stats.svg README.md
          if ! git diff --staged --quiet; then
            git commit -m "auto: sync LeetCode statistics from profile [skip ci]"
            git push
          else
            echo "No changes in LeetCode statistics."
          fi
