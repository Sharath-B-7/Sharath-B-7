name: Sync LeetCode & GitHub Statistics

on:
  schedule:
    - cron: '*/30 * * * *'    # every 30 minutes — near-real-time sync
  workflow_dispatch:            # manual trigger from GitHub Actions UI
  repository_dispatch:          # triggered by other repos (via API call)
    types: [contribution-made]
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/leetcode_stats.svg'
      - 'assets/github_stats.svg'
      - 'README.md'

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Sync LeetCode & GitHub Statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_leetcode.py

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode_stats.svg assets/github_stats.svg README.md
          if ! git diff --staged --quiet; then
            git commit -m "auto: sync LeetCode & GitHub statistics [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected."
          fi
