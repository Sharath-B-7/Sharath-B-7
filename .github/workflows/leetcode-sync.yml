name: Sync LeetCode & GitHub Statistics

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/leetcode_stats.svg'
      - 'assets/github_stats.svg'
      - 'README.md'

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history needed for safe rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Sync LeetCode & GitHub Statistics
        run: python scripts/update_leetcode.py

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode_stats.svg assets/github_stats.svg README.md
          if ! git diff --staged --quiet; then
            git commit -m "auto: sync LeetCode & GitHub statistics [skip ci]"
            # Pull with rebase so our commit sits on top of any concurrent push
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected."
          fi
