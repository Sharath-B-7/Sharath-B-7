<svg fill="none" viewBox="0 0 850 220" width="850" height="220" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .gh-card {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
          border: 1px solid #30363d;
          border-radius: 16px;
          padding: 24px 36px;
          box-sizing: border-box;
          width: 850px;
          height: 220px;
          color: #c9d1d9;
          position: relative;
          overflow: hidden;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .gh-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 20px;
          border-bottom: 1px solid #21262d;
          padding-bottom: 12px;
        }

        .gh-title {
          font-size: 20px;
          font-weight: 700;
          color: #38bdf8;
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .gh-user {
          font-size: 14px;
          color: #8b949e;
          font-family: 'Fira Code', monospace;
          background: #21262d;
          padding: 4px 12px;
          border-radius: 20px;
          border: 1px solid #30363d;
        }

        .gh-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 20px;
        }

        .gh-stat {
          background: rgba(22, 27, 34, 0.8);
          border: 1px solid #30363d;
          border-radius: 12px;
          padding: 16px;
          text-align: center;
        }

        .gh-num {
          font-size: 28px;
          font-weight: 800;
          color: #38bdf8;
          font-family: 'Fira Code', monospace;
        }

        .gh-label {
          font-size: 12px;
          color: #8b949e;
          margin-top: 4px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }
      </style>

      <div class="gh-card">
        <div class="gh-header">
          <div class="gh-title">
            <span>📊</span> GITHUB ANALYTICS &amp; ACTIVITY
          </div>
          <div class="gh-user">@Sharath-B-7</div>
        </div>

        <div class="gh-grid">
          <div class="gh-stat">
            <div class="gh-num">6</div>
            <div class="gh-label">📦 Public Repositories</div>
          </div>
          <div class="gh-stat">
            <div class="gh-num">0</div>
            <div class="gh-label">👥 Followers</div>
          </div>
          <div class="gh-stat">
            <div class="gh-num" style="color: #f0883e;">443</div>
            <div class="gh-label">🧠 LeetCode Solved</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>