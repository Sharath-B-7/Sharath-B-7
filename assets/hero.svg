<svg fill="none" viewBox="0 0 850 340" width="850" height="340" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes typewriter {
          /* Title 1: Cybersecurity Engineer (22ch) */
          0%       { content: "Cybersecurity Engineer"; width: 0ch; }
          2.5%     { content: "Cybersecurity Engineer"; width: 22ch; }
          11.5%    { content: "Cybersecurity Engineer"; width: 22ch; }
          13.8%    { content: "Cybersecurity Engineer"; width: 0ch; }
          14.28%   { content: ""; width: 0ch; }

          /* Title 2: AI &amp; ML Developer (17ch) */
          14.29%   { content: "AI &amp; ML Developer"; width: 0ch; }
          16.8%    { content: "AI &amp; ML Developer"; width: 17ch; }
          25.8%    { content: "AI &amp; ML Developer"; width: 17ch; }
          28.1%    { content: "AI &amp; ML Developer"; width: 0ch; }
          28.56%   { content: ""; width: 0ch; }

          /* Title 3: Full-Stack Developer (20ch) */
          28.57%   { content: "Full-Stack Developer"; width: 0ch; }
          31.1%    { content: "Full-Stack Developer"; width: 20ch; }
          40.1%    { content: "Full-Stack Developer"; width: 20ch; }
          42.4%    { content: "Full-Stack Developer"; width: 0ch; }
          42.84%   { content: ""; width: 0ch; }

          /* Title 4: Security-Focused Developer (26ch) */
          42.85%   { content: "Security-Focused Developer"; width: 0ch; }
          45.4%    { content: "Security-Focused Developer"; width: 26ch; }
          54.4%    { content: "Security-Focused Developer"; width: 26ch; }
          56.7%    { content: "Security-Focused Developer"; width: 0ch; }
          57.12%   { content: ""; width: 0ch; }

          /* Title 5: Problem Solver (14ch) */
          57.13%   { content: "Problem Solver"; width: 0ch; }
          59.6%    { content: "Problem Solver"; width: 14ch; }
          68.6%    { content: "Problem Solver"; width: 14ch; }
          70.9%    { content: "Problem Solver"; width: 0ch; }
          71.40%   { content: ""; width: 0ch; }

          /* Title 6: Software Developer (18ch) */
          71.41%   { content: "Software Developer"; width: 0ch; }
          73.9%    { content: "Software Developer"; width: 18ch; }
          82.9%    { content: "Software Developer"; width: 18ch; }
          85.2%    { content: "Software Developer"; width: 0ch; }
          85.68%   { content: ""; width: 0ch; }

          /* Title 7: Building Secure Systems (22ch) */
          85.69%   { content: "Building Secure Systems"; width: 0ch; }
          88.2%    { content: "Building Secure Systems"; width: 22ch; }
          97.2%    { content: "Building Secure Systems"; width: 22ch; }
          99.5%    { content: "Building Secure Systems"; width: 0ch; }
          100%     { content: ""; width: 0ch; }
        }

        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
        }

        @keyframes pulseGlow {
          0%, 100% { opacity: 0.4; transform: scale(1); }
          50% { opacity: 0.7; transform: scale(1.05); }
        }

        .container {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background: linear-gradient(135deg, #090d16 0%, #0d1117 50%, #111827 100%);
          border: 1px solid #233044;
          border-radius: 16px;
          padding: 32px 40px;
          box-sizing: border-box;
          width: 850px;
          height: 340px;
          position: relative;
          overflow: hidden;
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Ambient Glow Effect */
        .glow-cyan {
          position: absolute;
          top: -60px;
          right: -60px;
          width: 250px;
          height: 250px;
          background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
          border-radius: 50%;
          animation: pulseGlow 6s infinite ease-in-out;
        }

        .glow-purple {
          position: absolute;
          bottom: -80px;
          left: -40px;
          width: 300px;
          height: 300px;
          background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
          border-radius: 50%;
          animation: pulseGlow 8s infinite ease-in-out reverse;
        }

        /* Top terminal dots */
        .terminal-header {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 24px;
        }
        .dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }
        .terminal-title {
          margin-left: 12px;
          font-family: 'Fira Code', monospace, sans-serif;
          font-size: 13px;
          color: #6b7280;
          letter-spacing: 0.5px;
        }

        .greeting {
          font-size: 14px;
          font-weight: 600;
          letter-spacing: 2px;
          text-transform: uppercase;
          color: #38bdf8;
          margin-bottom: 6px;
        }

        .name {
          font-size: 38px;
          font-weight: 800;
          color: #ffffff;
          letter-spacing: -0.5px;
          margin-bottom: 12px;
          background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .role-wrapper {
          display: flex;
          align-items: center;
          font-size: 22px;
          font-weight: 600;
          color: #a78bfa;
          height: 36px;
          margin-bottom: 22px;
          font-family: 'Fira Code', Consolas, monospace;
        }

        .role-prefix {
          color: #38bdf8;
          margin-right: 10px;
        }

        .animated-text::after {
          content: "";
          display: inline-block;
          overflow: hidden;
          white-space: nowrap;
          vertical-align: bottom;
          animation: typewriter 32s infinite linear;
          color: #38bdf8;
          text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .cursor {
          display: inline-block;
          width: 10px;
          height: 22px;
          background-color: #38bdf8;
          margin-left: 4px;
          animation: blink 0.8s infinite;
          vertical-align: text-bottom;
          border-radius: 1px;
        }

        .tag-container {
          display: flex;
          gap: 12px;
          flex-wrap: wrap;
          align-items: center;
        }

        .tag {
          background: rgba(30, 41, 59, 0.8);
          border: 1px solid rgba(56, 189, 248, 0.25);
          color: #e2e8f0;
          padding: 6px 16px;
          border-radius: 20px;
          font-size: 13px;
          font-weight: 500;
          display: flex;
          align-items: center;
          gap: 8px;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .tag-accent {
          background: rgba(56, 189, 248, 0.12);
          border-color: rgba(56, 189, 248, 0.4);
          color: #38bdf8;
        }

        .tag-purple {
          background: rgba(139, 92, 246, 0.12);
          border-color: rgba(139, 92, 246, 0.4);
          color: #c084fc;
        }
      </style>

      <div class="container">
        <div class="glow-cyan"></div>
        <div class="glow-purple"></div>

        <div class="terminal-header">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
          <span class="terminal-title">sharath-b-7 ~/profile</span>
        </div>

        <div class="greeting">WELCOME TO MY PROFILE</div>
        <div class="name">Hi, I'm Sharath B</div>

        <div class="role-wrapper">
          <span class="role-prefix">&gt;</span>
          <span class="animated-text"></span>
          <span class="cursor"></span>
        </div>

        <div class="tag-container">
          <div class="tag tag-accent">
            <span>🛡️</span> Cyber Security Student
          </div>
          <div class="tag">
            <span>🤖</span> AI &amp; Software Dev
          </div>
          <div class="tag tag-purple">
            <span>🧩</span> Problem Solver
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
